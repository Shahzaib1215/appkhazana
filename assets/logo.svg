<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a6e"/><stop offset="1" stop-color="#0d1d38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5e"/><stop offset="1" stop-color="#e09a12"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b942"/><stop offset="1" stop-color="#c07f0e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- floating app tiles -->
  <rect x="26" y="12" width="11" height="11" rx="3" fill="#2f9e8f"/>
  <rect x="42" y="8" width="11" height="11" rx="3" fill="#7b5cff"/>
  <rect x="58" y="12" width="11" height="11" rx="3" fill="#ff8a3d"/>
  <circle cx="31" cy="17" r="2.2" fill="#fff" opacity=".9"/>
  <circle cx="47" cy="13" r="2.2" fill="#fff" opacity=".9"/>
  <circle cx="63" cy="17" r="2.2" fill="#fff" opacity=".9"/>
  <!-- coins -->
  <circle cx="30" cy="34" r="4.5" fill="url(#gold)"/>
  <circle cx="66" cy="34" r="4.5" fill="url(#gold)"/>
  <circle cx="48" cy="30" r="4.5" fill="url(#gold)"/>
  <!-- chest lid -->
  <path d="M24 52 Q24 38 48 38 Q72 38 72 52 L72 58 L24 58 Z" fill="url(#chest)"/>
  <rect x="24" y="52" width="48" height="6" fill="#a86e0a" opacity=".55"/>
  <!-- chest body -->
  <rect x="24" y="58" width="48" height="24" rx="3" fill="url(#chest)"/>
  <rect x="24" y="58" width="48" height="5" fill="#a86e0a" opacity=".45"/>
  <!-- gold bands -->
  <rect x="34" y="38" width="6" height="44" fill="#8a5c08" opacity=".8"/>
  <rect x="56" y="38" width="6" height="44" fill="#8a5c08" opacity=".8"/>
  <!-- lock -->
  <rect x="43" y="54" width="10" height="12" rx="2.5" fill="#8a5c08"/>
  <circle cx="48" cy="59" r="2" fill="#ffe9b0"/>
  <!-- sparkles -->
  <circle cx="22" cy="26" r="1.6" fill="#ffe9b0"/>
  <circle cx="74" cy="26" r="1.6" fill="#ffe9b0"/>
  <circle cx="80" cy="46" r="1.3" fill="#ffe9b0"/>
</svg>
